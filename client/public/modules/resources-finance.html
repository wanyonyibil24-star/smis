<div class=g style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class=card><h3>Fee collection</h3><div style="display:flex;gap:16px;align-items:center"><div class=ring style="background:conic-gradient(var(--ok) ${pc*3.6}deg,var(--line) 0)"><span>${pc}%</span></div><div>Collected ${M(co)}<br><span class=mut>of ${M(ex)} expected</span></div></div></div><div class=card><h3>Budget vs Amount Spent</h3>${bars(bv,r=>r[2])}</div><div class=card><h3>Assets by category</h3>${bars(Object.entries(cats).map(([k,v])=>[k,v/mx*100,v]),r=>r[2])}</div></div>
<div class=card><h3>Latest money movements</h3>${T(TXC,[...D.tx].reverse().slice(0,6).map(txr))}</div>`},
fees(){const g={};D.lrn.forEach(l=>{g[l.guardian]=g[l.guardian]||{n:[],b:0};g[l.guardian].n.push(l.name);g[l.guardian].b+=bal(l.id)});const pend=D.adj.filter(a=>a.status=='Pending');
return`<div class=tools>${EMB?'':`<button class="b p" onclick=lrnF()>+ Learner</button>`}<button class=b onclick=feeF()>+ Fee item</button><button class=b onclick="toast(billAll()+' invoice(s) created for '+D.set.term);done()">Create ${D.set.term} invoices</button></div>
<div class=card><h3>Learners · Learner → Fee structure → Invoice → Payment → Receipt → Balance</h3>${T(['Learner','Adm','Class','Billed','Discounts','Paid','Amount Still Owed',''],D.lrn.map(l=>[esc(l.name),l.adm,l.grade+' '+l.stream,M(billed(l.id)),M(adj(l.id)),M(paid(l.id)),`<b class="${bal(l.id)>0?'bad':'ok'}">${M(bal(l.id))}</b>`,`<button class=s onclick="pay('${l.id}')">Receive payment</button><button class=s onclick="adjF('${l.id}')">Adjust</button><button class=s onclick="stmt('${l.id}')">Statement</button>`]))}</div>
${pend.length?`<div class=card><h3>Waiting for approval</h3>${T(['Learner','Type','Amount','Reason',''],pend.map(a=>[L(a.lid).name,a.type,M(a.amt),esc(a.why),`<button class=s onclick="apprAdj('${a.id}')">Approve</button>`]))}</div>`:''}
<div class=card><h3>Parent / guardian view</h3>${T(['Guardian','Learners','Total Amount Still Owed'],Object.entries(g).map(([k,v])=>[esc(k),esc(v.n.join(', ')),M(v.b)]))}</div>
<div class=card><h3>Receipts</h3>${T(['Receipt','Date','Learner','Method','Reference','Amount',''],[...D.pay].reverse().map(p=>[p.rcp,dt(p.date),L(p.lid).name,p.method,esc(p.ref),p.void?'<s>'+M(p.amt)+'</s> reversed':M(p.amt),`<button class=s onclick="rcpt('${p.id}')">View</button>`+(p.void?'':`<button class=s onclick="revPay('${p.id}')">Reverse</button>`)]))}</div>
<div class=card><h3>Fee structure – ${D.set.year}</h3>${T(['Applies to','Category','Fee','Amount'],D.fee.map(f=>[f.grade,f.cat,esc(f.name),M(f.amt)]))}</div>`},
fin(){return`<div class=g>${K_('Money In',M(tin()),'income')}${K_('Money Out',M(tout()),'spent')}${K_('Balance',M(cash()),'cashbook')}</div><div class=tools><button class="b p" onclick="txF('in')">+ Money received</button><button class="b p" onclick="txF('out')">+ Money spent</button><button class=b onclick=budF()>Set budgets</button><button class=b onclick="rp('budget')">Budget vs actual</button></div>
<div class=card><h3>Cashbook</h3>${T(['Date','What for','Category','Method','Reference','Money In','Money Out','Status',''],[...D.tx].sort((a,b)=>a.date<b.date?1:-1).map(t=>[dt(t.date),esc(t.desc),t.cat,t.method,esc(t.ref),t.dir=='in'?M(t.amt):'',t.dir=='out'?M(t.amt):'',t.void?'Voided':t.status,t.void?'':(t.status=='Pending'?`<button class=s onclick="apprTx('${t.id}')">Approve</button>`:'')+`<button class=s onclick="voidTx('${t.id}')">Void</button>`]))}</div>`},
proc(){return`<div class=tools><button class="b p" onclick=reqF()>+ Purchase request</button><button class=b onclick=supF()>+ Supplier</button><button class=b onclick="rp('supplier')">Supplier statement</button></div><div class=card><h3>Purchase requests</h3>${T(['Request','Item','Qty','Estimate','Progress','Actions'],D.req.map(r=>[r.id,esc(r.title),r.qty,M(r.est),pipe(r.status,['Requested','Approved','Ordered','Received','Paid']),{Requested:`<button class=s onclick="apprReq('${r.id}')">Approve</button>`,Approved:`<button class=s onclick="ordF('${r.id}')">Quotes &amp; order</button>`,Ordered:`<button class=s onclick="podoc('${r.id}')">View PO</button><button class=s onclick="recF('${r.id}')">Receive goods</button>`,Received:`<button class=s onclick="invF('${r.id}')">Invoice &amp; pay</button>`,Paid:`<button class=s onclick="podoc('${r.id}')">View PO</button>`}[r.status]]))}</div><div class=card><h3>Suppliers</h3>${T(['Supplier','Phone'],D.sup.map(s=>[esc(s.name),esc(s.phone)]))}</div>`},
stores(){return`<div class=eq><b>Opening Stock + Stock In − Stock Out ± Adjustments = Available Stock</b></div><div class=tools><button class="b p" onclick=itmF()>+ Item</button><button class=b onclick="mvF('in')">Receive</button><button class=b onclick="mvF('out')">Issue</button><button class=b onclick="mvF('return')">Return</button><button class=b onclick=adjStock()>Count / adjust</button></div><div class=card><h3>Available stock ${low().length?`<span class=bad>· ${low().length} low</span>`:''}</h3>${T(['Item','Unit','Opening','In','Out','Adjust','Available','Minimum','Value'],D.itm.map(i=>{const m=D.mv.filter(x=>x.item==i.id),f=t=>sum(m.filter(x=>t.includes(x.type)),x=>x.q),s=stock(i.id);return[esc(i.name),i.unit,f(['open']),f(['in','return']),-f(['out']),f(['adj']),`<b class="${s<=i.min?'bad':'ok'}">${s}</b>`,i.min,M(s*i.cost)]}))}</div><div class=card><h3>Movement history</h3>${T(['Date','Item','Type','Qty','To / from','Reference'],[...D.mv].reverse().slice(0,25).map(m=>[dt(m.date),esc(I(m.item).name),m.type,m.q,esc(m.to),esc(m.ref||m.note)]))}</div>`},
assets(){return`<div class=tools><button class="b p" onclick=astF()>+ Asset</button><button class=b onclick="rp('alloc')">Allocation history</button></div><div class=card><h3>Asset register <span class=mut>(IDs are QR / barcode-ready)</span></h3>${T(['ID','Name','Category','Serial','Cost','Location','Responsible','Condition','Status',''],D.ast.map(a=>[`<code>${a.id}</code>`,esc(a.name),a.cat,esc(a.serial),M(a.cost),esc(a.loc),esc(a.who),a.cond,a.status,a.status=='In use'?`<button class=s onclick="alloF('${a.id}')">Allocate</button><button class=s onclick="dispF('${a.id}')">Retire</button>`:'']))}</div>`},
maint(){return`<div class=tools><button class="b p" onclick=mntF()>+ Report a problem</button></div><div class=card><h3>Maintenance</h3>${T(['Ref','Asset','Problem','Priority','Assigned','Estimate','Actual','Progress',''],D.mnt.map(m=>[m.id,m.aid?esc(D.ast.find(a=>a.id==m.aid).name):'Facility',esc(m.problem),m.pri,esc(m.who),M(m.est),M(m.act),pipe(m.status,MS),m.status=='Closed'?'':`<button class=s onclick="mntNext('${m.id}')">Next step</button>`]))}</div>`},
rep(){const n={bygrade:'Fee collection report',arrears:'Fee arrears',daily:'Daily collection',income:'Income report',spent:'Expenditure report',budget:'Budget vs actual',cashbook:'Cashbook',supplier:'Supplier statement',proc:'Procurement report',stock:'Stock report',moves:'Stock movements',low:'Low-stock report',assets:'Asset register',alloc:'Asset allocation',maint:'Maintenance report',summary:'Financial summary'};return`<p class=mut>Learner statements are on the Fees page; purchase orders and receipts open from Procurement and Fees. Every report can be printed or downloaded as CSV.</p><div class=g>${Object.entries(n).map(([k,v])=>`<button class=k onclick="rp('${k}')"><b style="font-size:16px">${v}</b></button>`).join('')}</div>`},
log(){return`<div class=card><h3>Audit trail · who, what, when, before → after</h3>${T(['When','Who','What','Details','Before','After'],D.log.map(l=>[l.t,l.u,l.a,esc(l.d),esc(l.p),esc(l.n)]))}</div>`}};
const N=[['dash','📊 Dashboard'],['fees','🎓 Fees'],['fin','💰 Finance'],['proc','🛒 Procurement'],['stores','📦 Stores'],['assets','🏫 Assets'],['maint','🔧 Maintenance'],['rep','📄 Reports'],['log','🛡️ Audit trail']];
function render(){$('#nav').innerHTML=N.map(n=>`<button class="${n[0]==cur?'on':''}" onclick="cur='${n[0]}';render()">${n[1]}</button>`).join('');$('#main').innerHTML=`<div class=top><h1>${N.find(n=>n[0]==cur)[1].slice(3)} <small class=mut style="font:400 14px Figtree">${esc(D.set.school)} · ${D.set.year} ${D.set.term}</small></h1><div class=tools>${EMB?`<span class=mut title="Your access comes from your NEXUS account">Signed in as <b>${esc(role)}</b></span>`:`<select onchange="role=this.value;render()" title="Preview what each role can do" style="width:auto">${Object.keys(ROLES).map(r=>`<option ${r==role?'selected':''}>${r}</option>`).join('')}</select>`}<button class=b onclick=setF()>Settings</button>${EMB?'':`<button class=b onclick="if(confirm('Reset all data to the sample data?')){D=seed();done()}">Reset sample data</button>`}</div></div>`+V[cur]()}
// ---- NEXUS SMIS host bridge (active only when this page is embedded in the SMIS)
function applyCtx(c){if(!c)return;if(ROLES[c.role])role=c.role;const s=D.set;if(c.school)s.school=c.school;if(c.year)s.year=String(c.year);if(c.term)s.term=c.term;if(c.grades&&c.grades.length)s.grades=c.grades;
(c.learners||[]).forEach(x=>{const l=D.lrn.find(l=>l.adm==x.adm);if(l)Object.assign(l,{name:x.name,grade:x.grade,stream:x.stream||'',guardian:x.guardian||'',phone:x.phone||''});else D.lrn.push({id:'L-'+String(x.id).padStart(4,'0'),adm:x.adm,name:x.name,grade:x.grade,stream:x.stream||'',cat:'Day',guardian:x.guardian||'',phone:x.phone||''})})}
if(EMB){addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;const m=e.data||{};
if(m.type=='nexus:init'){let had=false;if(m.state){try{D=JSON.parse(m.state);had=true}catch(x){blank()}}else blank();const b=JSON.stringify(D);applyCtx(m.ctx);ready=true;if(!had||JSON.stringify(D)!=b)save();render()}
else if(m.type=='nexus:state'){try{D=JSON.parse(m.state)}catch(x){return}applyCtx(m.ctx);render();toast('Someone else saved changes first. Showing the latest data - please repeat your last action.')}});
parent.postMessage({type:'nexus:ready'},location.origin)}
$('#m').onclick=e=>{if(e.target.id=='m')closeM()};if(!EMB)save();render();
</script></body></html>
