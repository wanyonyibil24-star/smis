<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXUS AI</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f2;--card:#fff;--ink:#17231f;--mut:#65736d;--line:#dfe4de;--side:#0f3b33;--acc:#c98a1b;--ok:#1f7a4d;--bad:#b23a2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101815;--card:#18231f;--ink:#e8efe9;--mut:#93a39b;--line:#2a3a34;--side:#0a2621}}
:root[data-theme=dark]{--bg:#101815;--card:#18231f;--ink:#e8efe9;--mut:#93a39b;--line:#2a3a34;--side:#0a2621}
body{margin:0;font:15px/1.5 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:flex;min-height:100vh}aside{width:224px;background:var(--side);color:#dfeee8;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex:none;box-sizing:border-box}
aside h2{font:700 18px 'Bricolage Grotesque',Georgia,serif;padding:0 10px 14px}aside h2 small{display:block;font:400 12px Figtree;opacity:.7}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer}nav button.on{background:rgba(255,255,255,.12);box-shadow:inset 3px 0 var(--acc)}
main{flex:1;min-width:0;padding:22px 26px;max-width:1000px}.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
h1,h3{font-family:'Bricolage Grotesque',Georgia,serif;margin:0}h1{font-size:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.card h3{margin-bottom:8px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:600}
.b,.s{font:inherit;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:8px;padding:8px 13px;cursor:pointer}.s{padding:3px 9px;font-size:13px;margin-right:4px}.p{background:var(--side);color:#fff;border-color:var(--side)}.b:hover,.s:hover{border-color:var(--acc)}.b:disabled{opacity:.5}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
label{display:block;margin:8px 0;font-weight:500;font-size:14px}input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:inherit;box-sizing:border-box}textarea{min-height:110px}
.msg{padding:10px 14px;border-radius:12px;margin:8px 0;max-width:88%;white-space:pre-wrap}.me{background:var(--side);color:#fff;margin-left:auto}.ai{background:var(--card);border:1px solid var(--line)}.ai.x{border-color:var(--bad)}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid currentColor}.src{font-size:13px;color:var(--mut);margin-top:6px}
.doc{background:#fff;color:#111;padding:26px;border:1px solid var(--line);border-radius:8px;white-space:pre-wrap}.sec{position:relative}.sec .tools{opacity:.9}
#t{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--side);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:99;max-width:90vw}
@media(max-width:760px){.app{flex-direction:column}aside{width:auto;height:auto;position:static}nav{display:flex;overflow-x:auto}nav button{width:auto;white-space:nowrap}main{padding:14px}}
@media print{aside,.top,.np,.tools{display:none!important}main{padding:0;max-width:none}.card{border:0;padding:0}.doc{border:0}}
</style>
</head>
<body>
<div class="app"><aside><h2>NEXUS AI<small>Secure school intelligence</small></h2><nav id="nav" aria-label="NEXUS AI sections"></nav></aside><main id="main"></main></div><div id="t" role="status" aria-live="polite"></div>
<script>
const $ = selector => document.querySelector(selector);
const esc = value => String(value ?? "").replace(/[&<>\"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[char]));
const origin = location.origin;
const menu = [["assistant", "Ask NEXUS AI"], ["studio", "Document Studio"], ["documents", "My AI Documents"], ["activity", "AI Activity"], ["settings", "AI Settings"]];
const defaults = { language: "English", difficulty: "Medium", format: "Word", dailyLimit: 20 };
const read = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key) || "null") ?? fallback; } catch { return fallback; } };
const state = { tab: "assistant", name: "NEXUS user", role: "Collaborator", question: "", loading: false, answer: null, error: "", conversation: [], activity: read("nexus-ai-activity-v2", []), documents: read("nexus-ai-documents-v2", []), settings: { ...defaults, ...read("nexus-ai-settings-v2", {}) }, pending: null, selectedDocument: null };
let requestNumber = 0;
const notify = text => { const toast = $("#t"); toast.textContent = text; toast.style.display = "block"; clearTimeout(notify.timer); notify.timer = setTimeout(() => { toast.style.display = "none"; }, 3200); };
const save = () => { localStorage.setItem("nexus-ai-documents-v2", JSON.stringify(state.documents)); localStorage.setItem("nexus-ai-activity-v2", JSON.stringify(state.activity)); localStorage.setItem("nexus-ai-settings-v2", JSON.stringify(state.settings)); };
const postHeight = () => requestAnimationFrame(() => parent.postMessage({ type: "nexus:resize", height: Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) }, origin));
const button = (label, action, primary = false) => `<button type="button" class="b${primary ? " p" : ""}" data-action="${action}">${label}</button>`;
const table = (headers, rows) => `<div class="tw"><table><thead><tr>${headers.map(item => `<th>${esc(item)}</th>`).join("")}</tr></thead><tbody>${rows.length ? rows.join("") : `<tr><td class="mut" colspan="${headers.length}">Nothing here yet.</td></tr>`}</tbody></table></div>`;
function renderAssistant() {
  const messages = state.conversation.map(item => item.question
    ? `<div class="msg me">${esc(item.question)}</div>`
    : `<div class="msg ai${item.error ? " x" : ""}"><span class="tag ${item.error ? "bad" : "ok"}">${item.error ? "Unavailable" : "Verified facts"}</span>${item.error ? `<p>${esc(item.error)}</p>` : item.facts.map(fact => `<div class="src"><b>${esc(fact.type)}</b><br>${esc(fact.text)}</div>`).join("") || `<p class="mut">No facts were returned.</p>`}<p class="src">Access was checked by the NEXUS server.</p></div>`).join("");
  const prompts = ["How many learners are enrolled?", "Show today's attendance", "Which learners have outstanding fees?", "Which items are below minimum stock?", "Explain how to generate a report card"];
  return `<div class="card"><h3>Ask about your school</h3><p class="mut">Answers use only school records allowed by your signed-in role. Every question is checked and audited by NEXUS.</p><div id="chat" aria-live="polite">${messages || `<div class="msg ai">Ask about attendance, assessments, fees, finance, or school inventory.</div>`}${state.loading ? `<div class="msg ai">Checking authorized school records...</div>` : ""}</div>${state.error ? `<p class="bad" role="alert">${esc(state.error)}</p>` : ""}<form id="ask-form" class="tools"><input id="question" name="question" maxlength="500" required placeholder="e.g. Which Grade 8 learners have outstanding fees?" style="flex:1;min-width:200px" value="${esc(state.question)}"><button class="b p" id="ask-button" ${state.loading ? "disabled" : ""}>${state.loading ? "Checking..." : "Ask"}</button></form><div class="tools">${prompts.map(prompt => `<button type="button" class="s" data-prompt="${esc(prompt)}">${esc(prompt)}</button>`).join("")}</div></div>`;
}
function renderStudio() {
  const settings = state.settings;
  return `<div class="card"><h3>Guided document</h3><p class="mut">Create a structured Kenyan CBC draft. Review it before sharing; no learner personal data is inserted.</p><form id="document-form"><div class="g2"><label>Document type<select name="type">${["Lesson Plan", "Lesson Notes", "Scheme of Work", "Assessment", "Quiz", "Exam", "Worksheet", "Rubric", "CBC Activity", "Remedial Plan", "Revision Material", "Homework", "Learner Feedback", "School Letter", "Parent Communication"].map(type => `<option>${type}</option>`).join("")}</select></label><label>Subject<select name="subject">${["Mathematics", "English", "Kiswahili", "Integrated Science", "Social Studies", "Agriculture and Nutrition", "Pre-Technical Studies", "CRE", "Creative Arts and Sports"].map(subject => `<option>${subject}</option>`).join("")}</select></label><label>Grade / class<select name="grade">${[7, 8, 9].map(grade => `<option>Grade ${grade}</option>`).join("")}</select></label><label>Term<select name="term">${[1, 2, 3].map(term => `<option>Term ${term}</option>`).join("")}</select></label><label>Topic / strand<input name="topic" required placeholder="e.g. Fractions, energy, ecosystems"></label><label>Duration<input name="duration" value="40 minutes"></label><label>Competency<input name="competency" placeholder="e.g. Critical thinking and problem solving"></label><label>Learning outcomes<input name="outcomes" placeholder="Describe expected learner outcomes"></label><label>Difficulty<select name="difficulty"><option>Easy</option><option${settings.difficulty === "Medium" ? " selected" : ""}>Medium</option><option>Hard</option></select></label><label>Questions / pages<input name="count" type="number" min="1" max="50" value="10"></label><label>Language<select name="language"><option${settings.language === "English" ? " selected" : ""}>English</option><option${settings.language === "Kiswahili" ? " selected" : ""}>Kiswahili</option></select></label><label>Export format<select name="format"><option${settings.format === "Word" ? " selected" : ""}>Word</option><option${settings.format === "PDF" ? " selected" : ""}>PDF</option></select></label></div><div class="tools"><button class="b p">Create document draft</button></div></form></div>`;
}
function renderDocuments() {
  const selected = state.documents.find(document => document.id === state.selectedDocument) ?? state.documents[0];
  const rows = state.documents.map(document => `<tr><td>${esc(new Date(document.createdAt).toLocaleDateString())}</td><td>${esc(document.title)}</td><td>${esc(document.type)}</td><td><button class="s" data-open="${esc(document.id)}">Open</button><button class="s" data-delete="${esc(document.id)}" aria-label="Delete ${esc(document.title)}">Delete</button></td></tr>`);
  const preview = selected ? `<article class="card"><h3>${esc(selected.title)}</h3><p class="mut">${esc(selected.grade)} · ${esc(selected.subject)} · Term ${esc(selected.term)}</p><div class="doc" id="document-preview">${esc(selected.body)}</div><div class="tools np">${button("Copy", "copy-document")}${button("Download Word", "download-document")}${button("Print / PDF", "print-document", true)}</div></article>` : `<div class="card mut">No saved documents yet. Create one in Document Studio.</div>`;
  return `<div class="card"><h3>My AI documents</h3>${table(["Saved", "Title", "Type", ""], rows)}</div>${preview}`;
}
function renderActivity() {
  const rows = state.activity.map(entry => `<tr><td>${esc(new Date(entry.at).toLocaleString())}</td><td>${esc(entry.question)}</td><td>${esc(entry.status || "Submitted")}</td></tr>`);
  return `<div class="card"><h3>AI activity &amp; audit trail</h3><p class="mut">The NEXUS server records each question and checks permissions. This list shows recent questions from this browser.</p>${table(["When", "Question", "Status"], rows)}</div>`;
}
function renderSettings() {
  const settings = state.settings;
  return `<div class="card"><h3>AI settings</h3><p class="mut">Provider secrets and school-wide access policies are managed on the NEXUS server and are not exposed in this browser.</p><form id="settings-form" class="g2"><label>Default language<select name="language"><option${settings.language === "English" ? " selected" : ""}>English</option><option${settings.language === "Kiswahili" ? " selected" : ""}>Kiswahili</option></select></label><label>Default difficulty<select name="difficulty"><option${settings.difficulty === "Easy" ? " selected" : ""}>Easy</option><option${settings.difficulty === "Medium" ? " selected" : ""}>Medium</option><option${settings.difficulty === "Hard" ? " selected" : ""}>Hard</option></select></label><label>Export format<select name="format"><option${settings.format === "Word" ? " selected" : ""}>Word</option><option${settings.format === "PDF" ? " selected" : ""}>PDF</option></select></label><label>Daily request reminder<input name="dailyLimit" type="number" min="1" max="100" value="${Number(settings.dailyLimit) || defaults.dailyLimit}"></label><div class="tools"><button class="b p">Save settings</button></div></form></div><div class="card"><h3>Protected by NEXUS IAM</h3><p class="mut">AI access is permission-checked on the server. Provider secrets never appear in this browser, and responses are limited to facts your account is allowed to access.</p></div>`;
}
function render() {
  const current = menu.find(item => item[0] === state.tab) ?? menu[0];
  $("#nav").innerHTML = menu.map(([key, label]) => `<button type="button" class="${key === state.tab ? "on" : ""}" data-tab="${key}" aria-current="${key === state.tab ? "page" : "false"}">${label}</button>`).join("");
  $("#main").innerHTML = `<div class="top"><h1>${current[1]}</h1><div class="tools"><span class="mut">Signed in as <b>${esc(state.name)}</b> · ${esc(state.role)}</span></div></div>${({ assistant: renderAssistant, studio: renderStudio, documents: renderDocuments, activity: renderActivity, settings: renderSettings })[state.tab]()}`;
  postHeight();
}
function ask(event) {
  event.preventDefault();
  const question = String(new FormData(event.currentTarget).get("question") || "").trim();
  if (!question || state.loading) return;
  state.question = question;
  state.conversation.push({ question });
  state.loading = true;
  state.error = "";
  state.pending = String(++requestNumber);
  render();
  parent.postMessage({ type: "nexus:ai:ask", requestId: state.pending, question }, origin);
}
function makeDocument(event) {
  event.preventDefault();
  const values = Object.fromEntries(new FormData(event.currentTarget));
  const topic = String(values.topic || "").trim();
  if (!topic) return notify("Enter a topic or strand first.");
  const language = String(values.language);
  const subject = String(values.subject);
  const type = String(values.type);
  const title = `${type} - ${subject} ${values.grade} - ${topic}`;
  const body = `${type}\n${"=".repeat(Math.min(64, title.length))}\n\nSchool: ${state.name}\nGrade: ${values.grade}\nLearning area: ${subject}\nTerm: ${values.term}\nTopic / strand: ${topic}\nDuration: ${values.duration}\n\nLearning intention\nLearners will explore ${topic} in ${subject} through practical, competency-based activities.\n\nSuccess criteria\n- Explain the key ideas using appropriate ${language} vocabulary.\n- Apply the learning to a familiar Kenyan context.\n- Demonstrate understanding through a formative task.\n\nLesson flow\n1. Starter and elicitation of prior knowledge.\n2. Teacher modelling and guided discovery.\n3. Pair or group practice with differentiation.\n4. Consolidation, assessment, and learner reflection.\n\nCompetency: ${values.competency || "Critical thinking and communication"}\nLearning outcomes: ${values.outcomes || "Learners explain the concept and apply it to a familiar context."}\nDifficulty: ${values.difficulty}\nQuestions / pages: ${values.count}\n\nNo real learner names or personal data are included.`;
  const document = { id: crypto.randomUUID(), title, type, grade: String(values.grade), subject, term: String(values.term), body, createdAt: new Date().toISOString() };
  state.documents.unshift(document);
  state.selectedDocument = document.id;
  state.activity.unshift({ question: `Created ${type}: ${topic}`, at: new Date().toISOString(), status: "Draft created" });
  save();
  state.tab = "documents";
  render();
  notify("Document draft saved.");
}
function downloadDocument() {
  const selected = state.documents.find(document => document.id === state.selectedDocument) ?? state.documents[0];
  if (!selected) return;
  const content = `<!doctype html><meta charset="utf-8"><title>${esc(selected.title)}</title><h1>${esc(selected.title)}</h1><pre style="white-space:pre-wrap;font:12pt Calibri">${esc(selected.body)}</pre>`;
  const url = URL.createObjectURL(new Blob([content], { type: "application/msword" }));
  const link = document.createElement("a"); link.href = url; link.download = `${selected.title.replace(/[^a-z0-9]+/gi, "_")}.doc`; link.click(); URL.revokeObjectURL(url);
}
function receiveMessage(event) {
  if (event.origin !== origin || event.source !== parent || !event.data || typeof event.data !== "object") return;
  const message = event.data;
  if (message.type === "nexus:init") {
    state.name = String(message.user?.name || "NEXUS user");
    state.role = String(message.user?.role || "Collaborator");
    render();
  } else if (message.type === "nexus:ai:result" && message.requestId === state.pending) {
    state.loading = false;
    state.pending = null;
    if (message.error) {
      state.conversation.push({ error: String(message.error) });
      state.error = String(message.error);
    } else {
      const facts = Array.isArray(message.facts) ? message.facts : [];
      state.conversation.push({ facts });
      state.activity.unshift({ question: state.question, at: new Date().toISOString(), status: "Checked by NEXUS" });
      state.activity = state.activity.slice(0, 100);
      state.error = "";
      save();
    }
    render();
  }
}
$("#nav").addEventListener("click", event => { const button = event.target.closest("[data-tab]"); if (!button) return; state.tab = button.dataset.tab; render(); });
$("#main").addEventListener("submit", event => { if (event.target.id === "ask-form") ask(event); if (event.target.id === "document-form") makeDocument(event); if (event.target.id === "settings-form") { event.preventDefault(); state.settings = { ...state.settings, ...Object.fromEntries(new FormData(event.target)) }; save(); notify("Personal settings saved."); render(); } });
$("#main").addEventListener("click", event => {
  const target = event.target.closest("[data-prompt], [data-open], [data-delete], [data-action]"); if (!target) return;
  if (target.dataset.prompt) { state.tab = "assistant"; state.question = target.dataset.prompt; render(); $("#question").focus(); }
  if (target.dataset.open) { state.selectedDocument = target.dataset.open; render(); }
  if (target.dataset.delete) { state.documents = state.documents.filter(document => document.id !== target.dataset.delete); if (state.selectedDocument === target.dataset.delete) state.selectedDocument = null; save(); render(); }
  if (target.dataset.action === "copy-document") { const selected = state.documents.find(document => document.id === state.selectedDocument) ?? state.documents[0]; if (selected) void navigator.clipboard?.writeText(selected.body).then(() => notify("Document copied.")); }
  if (target.dataset.action === "download-document") downloadDocument();
  if (target.dataset.action === "print-document") window.print();
});
addEventListener("message", receiveMessage);
parent.postMessage({ type: "nexus:ready" }, origin);
render();
</script>
</body>
</html>
